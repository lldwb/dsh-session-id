# dsh-session-id（显示名：会话增强）—— 全局挂载。
#
# 这里**故意**不按 preset 挂载：
# - 浏览器半是会话标题栏的两个按钮（复制 ID / 分享会话）与 composer 的重试按钮，
#   属于 Web 外壳的通用能力；
# - Host 半的工具（session_lookup / session_share）、/share/<token> 公开路由与
#   agent/request-error 重试闸门，要在任何模式、任何会话里都能用。
#
# 本行 id 同时是浏览器半的 locale 命名空间、`ctx.slots.register` 的 id 前缀、认证 RPC
# 通道 `/dsh-session-id` 的路径；但**不是**设置命名空间：本插件没有设置页，也没有
# Config 字段。改 id 要同步改 index.js 的 `name`、client.js 的 `NS` 常量与
# lib/rpc.mjs 的 `RPC_CHANNEL`。
#
# 原 `dsh-turn-retry`（失败重试）插件已并入本插件：它的 Loader 行、目录与 GitHub
# 仓库都已删除，重试能力现在由本行的 `lib/retry/**` + client.js 的重试按钮提供。
# 重试半的 RPC 通道保留旧名 `/dsh-turn-retry`（只影响插件内部，避免无谓回归）。
- insert:
    - id: dsh-session-id
      name: 'dsh-session-id'
